<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search — Movie Info App</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent:#E50914; --accent-2:#F5C518;
    --ink:#F5F5F1; --dark:#0A0A0C; --dark-elev:#17171C; --dark-elev-2:#212127;
    --muted:rgba(245,245,241,0.66); --faint:rgba(245,245,241,0.42);
    --hairline:rgba(245,245,241,0.12);
    --font-heading:'Bebas Neue',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --s-2xs:4px; --s-xs:8px; --s-sm:16px; --s-md:32px; --s-lg:64px; --s-xl:96px;
    --r-sm:4px; --r-md:8px;
    --sh-card:0 4px 12px rgba(0,0,0,0.50);
    --sh-hover:0 10px 24px rgba(0,0,0,0.60);
    --d-fast:150ms; --e-standard:cubic-bezier(0.2,0.7,0,1);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-body); color:var(--ink); background:var(--dark); line-height:1.55; }
  a { color:inherit; text-decoration:none; }
  .accent-bar { height:4px; background:var(--accent); }
  header.nav { display:flex; align-items:center; justify-content:space-between; padding:var(--s-sm) var(--s-lg); border-bottom:1px solid var(--hairline); }
  header.nav .brand { display:flex; align-items:center; gap:var(--s-xs); }
  header.nav .mark { width:26px; height:26px; border-radius:4px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-size:15px; }
  header.nav .name { font-family:var(--font-heading); font-size:20px; letter-spacing:0.02em; }
  header.nav nav { display:flex; gap:var(--s-md); align-items:center; font-size:14px; font-weight:500; }
  header.nav nav a { color:var(--muted); transition:color var(--d-fast) var(--e-standard); }
  header.nav nav a:hover, header.nav nav a.active { color:var(--ink); }
  header.nav nav a.cta { color:var(--ink); border:1.5px solid rgba(255,255,255,0.28); border-radius:var(--r-sm); padding:8px 16px; }
  .wrap { max-width:1100px; margin:0 auto; padding:var(--s-lg) var(--s-lg) var(--s-xl); }
  .eyebrow { font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent-2); display:block; margin-bottom:var(--s-xs); }
  h1 { font-family:var(--font-heading); font-weight:400; font-size:44px; letter-spacing:0.01em; margin:0 0 var(--s-md); }
  .search-bar { display:flex; gap:var(--s-sm); margin-bottom:var(--s-md); }
  .search-bar input[type=text] { flex:1; height:48px; border-radius:var(--r-sm); border:1px solid var(--hairline); background:var(--dark-elev); color:var(--ink); padding:0 var(--s-sm); font-size:15px; font-family:var(--font-body); }
  .search-bar input[type=text]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .filters { display:flex; gap:var(--s-sm); margin-bottom:var(--s-lg); flex-wrap:wrap; }
  select { height:40px; border-radius:var(--r-sm); border:1px solid var(--hairline); background:var(--dark-elev); color:var(--ink); padding:0 var(--s-sm); font-family:var(--font-body); font-size:14px; }
  .btn { font-family:var(--font-body); font-size:14px; font-weight:600; height:48px; padding:0 24px; border-radius:var(--r-sm); border:none; cursor:pointer; background:var(--accent); color:#fff; transition:transform var(--d-fast) var(--e-standard), box-shadow var(--d-fast) var(--e-standard); }
  .btn:hover { transform:translateY(-2px); box-shadow:var(--sh-hover); }
  .results { display:flex; flex-direction:column; gap:var(--s-sm); }
  .row { display:flex; gap:var(--s-md); align-items:center; background:var(--dark-elev); border:1px solid var(--hairline); border-radius:var(--r-md); padding:var(--s-sm) var(--s-md); box-shadow:var(--sh-card); transition:transform var(--d-fast) var(--e-standard), box-shadow var(--d-fast) var(--e-standard); }
  .row:hover { transform:translateY(-3px); box-shadow:var(--sh-hover); }
  .poster-thumb { width:56px; height:82px; border-radius:var(--r-sm); background:linear-gradient(160deg,#2a2a33,#111114); flex-shrink:0; }
  .info { flex:1; min-width:0; }
  .info .title { font-size:16px; font-weight:600; margin-bottom:2px; }
  .info .meta { font-size:13px; color:var(--faint); }
  .rating-pill { display:inline-flex; align-items:center; gap:4px; background:rgba(245,197,24,0.12); color:var(--accent-2); border:1px solid rgba(245,197,24,0.30); border-radius:20px; padding:3px 10px; font-size:12px; font-weight:600; flex-shrink:0; }
  footer.site { border-top:1px solid var(--hairline); padding:var(--s-md) var(--s-lg); display:flex; justify-content:space-between; color:var(--faint); font-size:12px; }
  footer.site a { color:var(--faint); }
  footer.site a:hover { color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="accent-bar"></div>
<header class="nav">
  <a class="brand" href="index.html">
    <span class="mark">M</span><span class="name">MOVIE INFO APP</span>
  </a>
  <nav>
    <a href="index.html">Browse</a>
    <a href="search.html" class="active">Search</a>
    <a href="watchlist.html">Watchlist</a>
    <a href="signup-login.html" class="cta">Sign up / Log in</a>
  </nav>
</header>
<div class="wrap">
  <span class="eyebrow">Search all years</span>
  <h1>Find a movie</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search by title, e.g. 'Pulp Fiction'" value="p" />
    <button class="btn">Search</button>
  </div>
  <div class="filters">
    <select><option>All years</option><option>1994</option><option>1999</option><option>2010</option><option>2019</option></select>
    <select><option>All genres</option><option>Drama</option><option>Crime</option><option>Action</option><option>Comedy</option></select>
  </div>
  <div class="results">
    <a class="row" href="movie-detail.html">
      <div class="poster-thumb"></div>
      <div class="info"><div class="title">Pulp Fiction</div><div class="meta">1994 · Crime · 154 min</div></div>
      <span class="rating-pill">★ 8.9</span>
    </a>
    <a class="row" href="movie-detail-no-links.html">
      <div class="poster-thumb"></div>
      <div class="info"><div class="title">Léon: The Professional</div><div class="meta">1994 · Action · 110 min</div></div>
      <span class="rating-pill">★ 8.5</span>
    </a>
  </div>
</div>
<footer class="site">
  <span>Movie Info App — a personally curated top-10, year by year.</span>
  <a href="founder-login.html">Founder area</a>
</footer>
</body>
</html>
</content>
