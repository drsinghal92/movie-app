# KaizenOS DEMO / TRAINING / INTERNAL preset.
# Copy to docs/profile.yaml for a light, local-only app. Nothing leaves the repo.

project: movie-app
mode: sketch                 # skips the adversarial and security passes
autonomy: stop-at-pr
default_story_autonomy: unattended
confidence_threshold: 6      # a little looser for throwaway work

interaction:
  mode: yolo                 # demo drafts straight through. add --yolo is unneeded here, pass --guided intent by editing this to guided when you want the loop.

models:
  planner: opus
  builder: sonnet            # still builds on Sonnet 5
  qa: sonnet
  reviewer: opus             # different model from the Sonnet builder. pr_reviewer is false, so this only costs on a manual /pr-review
  security: sonnet
  narrator: haiku

# What a run costs. Every event in logs/events.jsonl carries the measured token
# count, tool-use count and duration the Agent tool reports back when a subagent
# finishes. The dollar figure is the one derived number here, so it is always
# labelled estimated and never presented as measured. Rates are blended per
# million tokens, because the tool reports one token figure rather than a split.
cost:
  currency: USD
  rates:
    opus: 30.00
    sonnet: 6.00
    haiku: 1.00

overnight:
  local: true
  cloud: false

git:
  host: github
  remote: null
  branch_prefix: story/
  default_branch: main

tracking:
  backend: local             # opt-out, everything in-repo, no external service
  jira:
    enabled: false
    url: null
    project: null

qa:
  retries: 1

review:
  pr_reviewer: false           # demo skips the adversarial PR pass
  rounds: 1                  # adversarial review passes per story. 1 = one pass. 2 = one confirmation pass
                             # confined to round 1's highs. Never more, an Opus pass over a clean
                             # diff always finds something, so without a cap it never converges.
  action_floor: high         # which severity buys a build round. high routes back now, medium goes
                             # back once in one batch after the last gate layer, low is recorded only.
  merge: agent-on-green        # demo delegates merge, /merge lands gate-green PRs. No review gate at this tier, run /pr-review first if you want one
